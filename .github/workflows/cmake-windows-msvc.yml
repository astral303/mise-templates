name: cmake-windows-msvc

on:
  push:
    branches: [main]
    paths:
      - cmake-windows-msvc/**
      - .github/workflows/cmake-windows-msvc.yml
  pull_request:
    paths:
      - cmake-windows-msvc/**
      - .github/workflows/cmake-windows-msvc.yml
  # Weekly, to catch Visual Studio updates in the runner image.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.3
          # sha256 of mise/bin/mise.exe inside mise-v2026.10.3-windows-x64.zip.
          sha256: 1d137eaaa772bbcfc2210a7ceaa133347456f18138f17a20e8b2e46b64ec0391
          # test.ps1 installs cmake and ninja from tests/mise.lock. Without a cache, every run
          # downloads them and checks their sha256.
          install: false
          cache: false

      - run: pwsh -NoProfile -File cmake-windows-msvc/tests/test.ps1
