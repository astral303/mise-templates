name: python-uv

on:
  push:
    branches: [main]
    paths:
      - python-uv/**
      - .github/workflows/python-uv.yml
  pull_request:
    paths:
      - python-uv/**
      - .github/workflows/python-uv.yml
  # Weekly, to catch changes in the runner images.
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # mise-sha256 is the sha256 of mise/bin/mise.exe (Windows) or mise/bin/mise inside the
          # mise-v2026.10.3 release archive for that platform.
          - runner: windows-2025
            mise-sha256: 1d137eaaa772bbcfc2210a7ceaa133347456f18138f17a20e8b2e46b64ec0391
          - runner: ubuntu-24.04
            mise-sha256: 8d48bc510b7d844fad0bc7156c0855c2a1e7230c51e498a7f6b63b021f8b57c5
          - runner: macos-15
            mise-sha256: 0999bd4943523ccdbd149b5ad4080281536801b3f6406ac4495699bd0310969c
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.3
          sha256: ${{ matrix.mise-sha256 }}
          # test.ps1 installs Python and uv from tests/mise.lock. Without a cache, every run
          # downloads them and checks their sha256.
          install: false
          cache: false

      - run: pwsh -NoProfile -File python-uv/tests/test.ps1
