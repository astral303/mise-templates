# Template usage: https://github.com/astral303/mise-templates/blob/main/python-uv/README.md

[tools]
# Python for uv and the project's .venv. Change it with `mise use --pin -E local python@3.12`.
python = "3.14.9"

uv = "0.13.5"

[settings]
# Create .venv with uv when the project has a uv.lock, then activate it.
python.uv_venv_auto = "create|source"

[env]
# Do not switch this to mise's documented "{{ tools.python.path }}": that value is the install
# directory, and uv rebuilds .venv on every run with it. With the executable of the Python
# above, uv ignores the project's .python-version and its own downloaded Pythons. The
# `is defined` check keeps `mise env` working before that Python is installed.
UV_PYTHON = { value = "{% if tools.python is defined %}{{ tools.python.path }}{% if os() == 'windows' %}\\python.exe{% else %}/bin/python3{% endif %}{% endif %}", tools = true }
